<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>Static Five PD Red Vehicle Code</title>
<link href="https://fonts.googleapis.com/css2?family=Libre+Caslon+Text:wght@400;700&family=Public+Sans:wght@400;600&display=swap" rel="stylesheet">
<style id="css">
:root{--bg:#eef1f6;--card:#fff;--ink:#14213d;--mut:#55627a;--line:#d5dbe6;--navy:#0b2a5b;--red:#c8102e;--gold:#c9ab5a;--goldd:#7a5f12;--serif:'Libre Caslon Text',Georgia,'Times New Roman',serif;--sans:'Public Sans',system-ui,Segoe UI,Arial,sans-serif;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#0d1526;--card:#16213a;--ink:#e8ecf5;--mut:#9ba8c2;--line:#2a3857;--goldd:#e0c577}}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 72px);scroll-behavior:smooth}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 var(--sans)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--navy);z-index:30}
img{max-width:100%}button,input,select,textarea{font:inherit;color:inherit}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--navy);color:#fff;border-bottom:3px solid var(--gold)}
.bar{max-width:1040px;margin:auto;display:flex;align-items:center;gap:16px;padding:8px 20px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:12px;margin-right:auto;color:#fff;text-decoration:none}.brand img{width:42px;height:42px}
.brand b{font:700 18px var(--serif);display:block;line-height:1.1}.brand small{opacity:.75;font-size:12px}
nav a{color:#dfe6f5;text-decoration:none;margin-right:16px}nav a:hover{color:#fff;text-decoration:underline}
.btn{border:1px solid var(--line);background:var(--card);padding:8px 16px;border-radius:6px;cursor:pointer;font-weight:600}
.btn:hover{border-color:var(--navy)}.btn.pri{background:var(--red);border-color:var(--red);color:#fff}.btn.gold{background:var(--gold);border-color:var(--gold);color:#14213d}.btn.danger{color:var(--red)}
header .btn{background:transparent;color:#fff;border-color:#6f86b3}header .btn:hover{background:#fff2;border-color:#fff}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.adm{background:#fff6d6;color:#14213d;border-bottom:1px solid var(--gold)}.adm .bar{padding:10px 20px}.adm span{margin-right:auto;font-weight:600}.adm .btn{background:#fff}.adm .btn.pri{background:var(--red);color:#fff}
.hero{position:relative;color:#fff;background:#0b2a5b center/cover}.hero::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,#0b2a5bf2 20%,#0b2a5b99)}
.hero .in{position:relative;z-index:1;max-width:1040px;margin:auto;padding:64px 20px;display:flex;gap:32px;align-items:center}
.hero img.seal{width:170px;height:170px;flex:none}.hero h1{font:700 clamp(36px,6vw,60px)/1.05 var(--serif);margin:0 0 12px}.hero p{margin:0;max-width:46ch;font-size:18px;color:#e3e9f6}
main,.gov,footer{max-width:1040px;margin:auto;padding:0 20px}main{padding-top:36px}
.tools{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:8px}.tools input,.tools select{padding:10px 12px;border:1px solid var(--line);border-radius:6px;background:var(--card)}.tools input{flex:1;min-width:200px}
.chap{font:700 24px var(--serif);margin:32px 0 10px;padding-bottom:6px;border-bottom:2px solid var(--gold)}
.row{background:var(--card);border:1px solid var(--line);border-left:4px solid var(--navy);border-radius:6px;margin-bottom:8px}.row.open{border-left-color:var(--red)}
.head{all:unset;box-sizing:border-box;display:flex;align-items:center;gap:14px;width:100%;padding:14px 16px;cursor:pointer;flex-wrap:wrap}.head:focus-visible{outline:3px solid var(--gold)}
.sec{font:700 15px var(--serif);color:var(--goldd);min-width:84px}.ttl{flex:1;font-weight:600;min-width:160px}
.pill{font-size:13px;font-weight:600;padding:2px 10px;border-radius:99px;border:1.5px solid}.infraction{color:var(--mut);border-color:var(--mut)}.misdemeanor{color:var(--goldd);border-color:var(--goldd)}.felony{color:var(--red);border-color:var(--red)}
.body{padding:0 16px 16px 114px}.body p{margin:0 0 12px;max-width:70ch}.body dl{display:grid;grid-template-columns:auto 1fr;gap:4px 16px;margin:0 0 12px}.body dt{color:var(--mut)}.body dd{margin:0;font-weight:600}.acts{display:flex;gap:8px}
.empty{padding:32px;text-align:center;color:var(--mut)}
.gov{margin:56px auto}.gov .card{background:#fff;color:#14213d;border:1px solid var(--line);border-top:5px solid var(--gold);border-radius:6px;display:grid;grid-template-columns:260px 1fr;gap:32px;padding:32px;align-items:center}
.gov img.pt{width:100%;border-radius:4px;background:#e9edf5}.gov h2{font:700 28px var(--serif);margin:0 0 12px}.gov p{max-width:56ch;margin:0 0 8px}.gov img.sig{width:200px;display:block;margin-top:12px}.gov small{color:#55627a}
footer{padding-bottom:40px;color:var(--mut);font-size:14px;text-align:center}footer img{width:56px;opacity:.9;display:block;margin:0 auto 8px}
.ov{position:fixed;inset:0;background:#0009;z-index:50;display:flex;align-items:flex-start;justify-content:center;padding:5vh 16px;overflow:auto}
.dlg{background:var(--card);border-radius:8px;padding:24px;width:100%;max-width:520px;border-top:5px solid var(--red)}.dlg h3{font:700 22px var(--serif);margin:0 0 16px}
.dlg label{display:block;font-weight:600;margin-bottom:12px;font-size:14px}.dlg input,.dlg select,.dlg textarea{display:block;width:100%;margin-top:4px;padding:9px 10px;border:1px solid var(--line);border-radius:6px;background:var(--bg);font-weight:400}.dlg textarea{min-height:90px}
.dlg .acts{justify-content:flex-end;margin-top:8px}.err{color:var(--red);min-height:22px;font-size:14px;margin:0 0 6px}
.toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 20px);transform:translateX(-50%);background:var(--navy);color:#fff;padding:10px 18px;border-radius:6px;z-index:60;max-width:90vw}
.new{margin-left:10px;font-size:12px;font-weight:600;background:var(--gold);color:#14213d;padding:1px 8px;border-radius:99px;vertical-align:middle}.chaphead{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:32px 0 10px;border-bottom:2px solid var(--gold);padding-bottom:6px}.chaphead .chap{margin:0;border:0;padding:0;flex:1}.empty .btn{margin-top:8px}.row.ed{display:flex;flex-wrap:wrap;align-items:stretch}.row.ed>.head{flex:1 1 0;min-width:0;width:auto}.row.ed>.body{flex:1 1 100%}.mv{display:flex;flex-direction:column;justify-content:center;gap:4px;padding:6px 10px 6px 0}.mv .btn{padding:2px 12px;min-height:0;line-height:1.2;font-size:14px}.mv .btn:disabled{opacity:.35;cursor:default}
@media(max-width:720px){.hero .in{flex-direction:column;align-items:flex-start;padding:40px 20px}.hero img.seal{width:100px;height:100px}.gov .card{grid-template-columns:1fr;padding:20px}.gov img.pt{max-width:240px}.body{padding-left:16px}nav{order:3;width:100%}}
html{-webkit-text-size-adjust:100%}button,.btn,select,input,nav a{touch-action:manipulation}.ttl,.hero h1,.body p{overflow-wrap:anywhere}
@media(max-width:600px){
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 110px)}
.bar{padding:8px 14px;gap:6px 12px}.brand{gap:10px}.brand img{width:36px;height:36px}.brand b{font-size:16px}
nav{display:flex;gap:4px 14px}nav a{display:inline-flex;align-items:center;min-height:40px;margin-right:0}
.btn{min-height:44px;padding:10px 16px}header .btn{min-height:40px;padding:6px 14px}
.hero .in{padding:32px 16px;gap:16px}.hero p{font-size:16px}
main,.gov,footer{padding-left:14px;padding-right:14px}main{padding-top:24px}
.tools{flex-direction:column;align-items:stretch}.tools input,.tools select{width:100%;min-width:0;min-height:46px}
.chap{font-size:21px;margin-top:24px}.chaphead{margin-top:24px}.chaphead .btn{flex:1 1 100%}
.head{gap:8px 10px;padding:12px 14px;min-height:48px}.head .sec{order:1;min-width:0}.head .pill{order:2;margin-left:auto}.head .ttl{order:3;flex:1 1 100%;min-width:0}
.body{padding:0 14px 14px}.acts .btn{flex:1}
.adm .bar{padding:10px 14px}.adm span{flex:1 1 100%}.adm .btn{flex:1 1 calc(50% - 8px)}
.ov{padding:12px}.dlg{padding:20px;border-radius:10px}.dlg .acts{flex-direction:column-reverse}.dlg .acts .btn{width:100%}
.gov{margin:32px auto}.gov .card{padding:20px;gap:20px}.gov h2{font-size:24px}.gov img.pt{max-width:200px;justify-self:center}.gov img.sig{width:160px}
.toast{width:calc(100% - 28px);text-align:center}.new{margin-left:6px}}
@media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}}
</style></head><body><div id="root"></div>

 o&&h('div',{class:'body'},h('p',null,c.text||'No description yet.'),h('dl',null,h('dt',null,'Fine'),h('dd',null,c.fine||'None'),h('dt',null,'Jail'),h('dd',null,c.jail||'None')),
  admin&&h('div',{class:'acts'},h('button',{class:'btn',onclick:()=>form(c)},'Edit'),(()=>{const b=h('button',{class:'btn danger'},'Delete');b.onclick=()=>{if(b.dataset.s){S.codes=S.codes.filter(x=>x!==c);dirty++;root()}else{b.dataset.s=1;b.textContent='Confirm delete'}};return b})())))}
function moveCode(c,d){const sib=S.codes.filter(x=>x.cat===c.cat),i=sib.indexOf(c),t=sib[i+d];if(!t)return;const a=S.codes.indexOf(c),b=S.codes.indexOf(t);S.codes[a]=t;S.codes[b]=c;dirty++;const y=window.scrollY;root();window.scrollTo(0,y)}

 if(cat==='__recent'&&!S.codes.some(isNew))cat='All';
 const rc=cat==='__recent',m=S.codes.filter(c=>(cat==='All'||rc||c.cat===cat)&&(c.sec+' '+c.title+' '+c.text).toLowerCase().includes(ql));

  L.append(h('div',{class:'chaphead'},h('h2',{class:'chap'},k),admin&&h('button',{class:'btn',onclick:()=>form(null,k)},'Add code to this chapter'),admin&&emp&&h('button',{class:'btn danger',onclick:()=>{S.chapters=S.chapters.filter(x=>x!==k);dirty++;root()}},'Remove chapter')),...list.map(row),...(list.length?[]:[h('p',{class:'empty'},'No codes in this chapter yet.')]))});
